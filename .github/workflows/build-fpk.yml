name: Build Fngram FPK (x86_64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build FPK
        env:
          TARGET_ARCH: x64
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-native-fpk.sh

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fngram-fpk-x64
          path: release/*.fpk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fngram ${{ github.ref_name }}
          body: |
            ## Fngram ${{ github.ref_name }}

            x86_64 FPK 安装包，适用于飞牛 OS / fnOS x86_64 设备。

            ### 安装方式
            1. 下载下方 .fpk 文件
            2. 在 fnOS 应用中心上传安装
            3. 或在 Fngram 管理后台「运行诊断」中一键下载更新
          files: release/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
