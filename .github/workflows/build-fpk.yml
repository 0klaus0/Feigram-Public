name: Build Fngram FPK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install server dependencies
        run: |
          echo "Installing server dependencies..."
          cd server && npm ci
          echo "Server dependencies installed"

      - name: Install client dependencies
        run: |
          echo "Installing client dependencies..."
          cd client && npm ci
          echo "Client dependencies installed"

      - name: Download Node.js binary for runtime
        id: node-download
        env:
          TARGET_ARCH: ${{ matrix.platform }}
        run: |
          echo "Downloading Node.js binary for ${TARGET_ARCH}..."
          ROOT_DIR="${{ github.workspace }}"
          NODE_VERSION="20.18.0"
          if [ "${TARGET_ARCH}" = "arm64" ]; then
            ARCHIVE="node-v${NODE_VERSION}-linux-arm64.tar.xz"
          else
            ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
          fi
          
          # Try multiple mirrors
          URLS=(
            "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}"
            "https://npmmirror.com/mirrors/node/v${NODE_VERSION}/${ARCHIVE}"
            "https://mirrors.tuna.tsinghua.edu.cn/nodejs-release/v${NODE_VERSION}/${ARCHIVE}"
          )
          
          TMP_DIR="${ROOT_DIR}/tmp/node-runtime"
          mkdir -p "${TMP_DIR}"
          DOWNLOAD_SUCCESS=0
          
          for url in "${URLS[@]}"; do
            echo "Trying to download from: $url"
            if curl -fL --connect-timeout 30 --max-time 180 --retry 3 --retry-delay 5 -o "${TMP_DIR}/${ARCHIVE}" "$url"; then
              if [ -s "${TMP_DIR}/${ARCHIVE}" ]; then
                echo "Download successful from: $url"
                DOWNLOAD_SUCCESS=1
                break
              else
                echo "Downloaded file is empty or invalid"
              fi
            else
              echo "Failed to download from: $url"
            fi
          done
          
          if [ $DOWNLOAD_SUCCESS -ne 1 ]; then
            echo "ERROR: All download attempts failed"
            exit 1
          fi
          
          echo "Extracting Node.js..."
          tar -xJf "${TMP_DIR}/${ARCHIVE}" -C "${TMP_DIR}"
          mkdir -p "${ROOT_DIR}/fnos-native-package/app/bin"
          cp "${TMP_DIR}/node-v${NODE_VERSION}-linux-${TARGET_ARCH}/bin/node" "${ROOT_DIR}/fnos-native-package/app/bin/node"
          chmod +x "${ROOT_DIR}/fnos-native-package/app/bin/node"
          echo "Node.js binary installed at ${ROOT_DIR}/fnos-native-package/app/bin/node"
          
          # Cleanup
          rm -rf "${TMP_DIR}"
          
          echo "Node.js version: $("${ROOT_DIR}/fnos-native-package/app/bin/node" --version)"

      - name: Build client
        run: |
          echo "Building client with Vite..."
          cd client && npx vite build
          echo "Client build completed"

      - name: Prepare server public
        run: |
          echo "Preparing server public directory..."
          rm -rf "${{ github.workspace }}/server/public"
          cp -R "${{ github.workspace }}/client/dist" "${{ github.workspace }}/server/public"
          echo "Server public directory prepared"

      - name: Package FPK
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Packaging FPK for ${PLATFORM}..."
          set -euo pipefail
          ROOT_DIR="${{ github.workspace }}"
          PKG_NAME="fngram-${{ github.ref_name }}-${PLATFORM}"
          RELEASE_DIR="${ROOT_DIR}/release"
          WORK_DIR="${RELEASE_DIR}/${PKG_NAME}"
          PACKAGE_SRC="${ROOT_DIR}/fnos-native-package"

          rm -rf "${WORK_DIR}" "${RELEASE_DIR}/${PKG_NAME}.fpk"
          mkdir -p "${WORK_DIR}"
          cp -R "${PACKAGE_SRC}/." "${WORK_DIR}/"
          rm -rf "${WORK_DIR}/app/server"
          mkdir -p "${WORK_DIR}/app/server"

          cp "${ROOT_DIR}/server/package.json" "${WORK_DIR}/app/server/"
          cp -R "${ROOT_DIR}/server/src" "${ROOT_DIR}/server/public" "${WORK_DIR}/app/server/"
          cp -R "${ROOT_DIR}/server/node_modules" "${WORK_DIR}/app/server/"
          rm -rf "${WORK_DIR}/app/server/src/downloader"

          find "${WORK_DIR}" -name ".DS_Store" -delete
          find "${WORK_DIR}/cmd" -type f -exec chmod +x {} \;
          rm -f "${WORK_DIR}/app/bin/fngram-downloader"
          chmod +x "${WORK_DIR}/app/ui/proxy.cgi" "${WORK_DIR}/app/bin/node"

          (
            cd "${WORK_DIR}"
            mkdir -p app_payload
            cp -R app/server app_payload/server
            cp -R app/bin app_payload/bin
            cp -R app/ui app_payload/ui
            cp -R config app_payload/config
            tar -czf app.tgz -C app_payload server bin ui config
            rm -rf app app_payload
            tar -czf "${RELEASE_DIR}/${PKG_NAME}.fpk" *
          )

          echo "FPK package created: ${RELEASE_DIR}/${PKG_NAME}.fpk"
          ls -lh "${RELEASE_DIR}/${PKG_NAME}.fpk"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fngram-fpk-${{ matrix.platform }}
          path: release/*.fpk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fngram ${{ github.ref_name }}
          body: |
            ## Fngram ${{ github.ref_name }}

            ${{ matrix.platform == 'x64' && 'x86_64' || 'ARM64' }} FPK 安装包，适用于飞牛 OS / fnOS ${{ matrix.platform == 'x64' && 'x86_64' || 'ARM64' }} 设备。

            ### 安装方式
            1. 下载下方 .fpk 文件
            2. 在 fnOS 应用中心上传安装
            3. 或在 Fngram 管理后台「运行诊断」中一键下载更新
          files: release/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}