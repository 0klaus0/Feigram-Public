name: Build Fngram FPK (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: |
          echo "Node: $(node --version), npm: $(npm --version)"
          echo "Installing server dependencies..."
          npm --prefix server install --no-audit --no-fund 2>&1

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build FPK (ARM64)
        env:
          TARGET_ARCH: arm64
          VERSION: ${{ github.ref_name }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          echo "=== Starting FPK Build (ARM64) ==="
          echo "Node: $(node --version), npm: $(npm --version)"
          echo "Workspace: ${{ github.workspace }}"
          echo "Version: ${{ github.ref_name }}"

          # === Step 1: Download Node.js ARM64 binary (using QEMU only for this) ===
          echo "=== Step 1: Download Node.js ARM64 binary ==="
          bash scripts/prepare-native-runtime.sh 2>&1 | tee prepare.log
          echo "=== Runtime prepared ==="

          # === Step 2: Build client (on host) ===
          echo "=== Step 2: Build client ==="
          npm --prefix "${{ github.workspace }}/client" run build
          rm -rf "${{ github.workspace }}/server/public"
          cp -R "${{ github.workspace }}/client/dist" "${{ github.workspace }}/server/public"
          echo "=== Client built ==="

          # === Step 3: Package FPK ===
          echo "=== Step 3: Package FPK ==="
          ROOT_DIR="${{ github.workspace }}"
          PKG_NAME="fngram-${{ github.ref_name }}-arm64"
          RELEASE_DIR="${ROOT_DIR}/release"
          WORK_DIR="${RELEASE_DIR}/${PKG_NAME}"
          PACKAGE_SRC="${ROOT_DIR}/fnos-native-package"

          rm -rf "${WORK_DIR}" "${RELEASE_DIR}/${PKG_NAME}.fpk"
          mkdir -p "${WORK_DIR}"
          cp -R "${ROOT_DIR}/fnos-native-package/." "${WORK_DIR}/"
          rm -rf "${WORK_DIR}/app/server"
          mkdir -p "${WORK_DIR}/app/server"

          # Copy pre-installed server deps (from host, not QEMU)
          cp "${{ github.workspace }}/server/package.json" "${WORK_DIR}/app/server/"
          cp -R "${{ github.workspace }}/server/src" "${WORK_DIR}/app/server/"
          cp -R "${{ github.workspace }}/server/public" "${WORK_DIR}/app/server/"
          cp -R "${{ github.workspace }}/server/node_modules" "${WORK_DIR}/app/server/"
          rm -rf "${WORK_DIR}/app/server/src/downloader"

          find "${WORK_DIR}" -name ".DS_Store" -delete
          find "${WORK_DIR}/cmd" -type f -exec chmod +x {} \;
          rm -f "${WORK_DIR}/app/bin/fngram-downloader"
          chmod +x "${WORK_DIR}/app/ui/proxy.cgi" "${WORK_DIR}/app/bin/node"

          (
            cd "${WORK_DIR}"
            mkdir -p app_payload
            cp -R app/server app_payload/server
            cp -R app/bin app_payload/bin
            cp -R app/ui app_payload/ui
            cp -R config app_payload/config
            tar -czf app.tgz -C app_payload server bin ui config
            rm -rf app app_payload
            tar -czf "${RELEASE_DIR}/${PKG_NAME}.fpk" *
          )

          ls -lh "${RELEASE_DIR}/${PKG_NAME}.fpk"
          echo "=== FPK Build completed ==="

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fngram-fpk-arm64
          path: release/*.fpk
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fngram ${{ github.ref_name }}
          body: |
            ## Fngram ${{ github.ref_name }}

            ARM64 FPK 安装包，适用于飞牛 OS / fnOS ARM 设备。

            ### 安装方式
            1. 下载下方 .fpk 文件
            2. 在 fnOS 应用中心上传安装
            3. 或在 Fngram 管理后台「运行诊断」中一键下载更新
          files: release/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}