name: Build Fngram FPK (ARM64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      TARGET_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build FPK
        run: bash scripts/build-native-fpk.sh

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fngram-fpk-arm64
          path: release/*.fpk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Fngram v${{ env.VERSION }}
          body: |
            ## Fngram v${{ env.VERSION }}

            ARM64 FPK 安装包，适用于飞牛 OS / fnOS ARM 设备。

            ### 安装方式
            1. 下载下方 .fpk 文件
            2. 在 fnOS 应用中心上传安装
            3. 或在 Fngram 管理后台「运行诊断」中一键下载更新
          files: release/*.fpk
        env:
          VERSION: "2.0.51"
