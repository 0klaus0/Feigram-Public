name: Build Fngram FPK (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install client dependencies
        run: |
          echo "Installing client dependencies with npm ci..."
          cd "${{ github.workspace }}/client" && npm ci
          echo "Client dependencies installed"

      - name: Install server dependencies
        run: |
          echo "=== Debug: listing server directory ==="
          ls -la server/
          echo "=== Running npm ci in server ==="
          cd server && npm ci
          echo "Server dependencies installed"

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download Node.js ARM64 binary
        env:
          TARGET_ARCH: arm64
        run: |
          "${{ github.workspace }}/scripts/prepare-native-runtime.sh"
          echo "Node.js version: $("${{ github.workspace }}/fnos-native-package/app/bin/node" --version)"

      - name: Build client
        run: |
          echo "=== Client build debug ==="
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Client directory: ${{ github.workspace }}/client"
          echo "Environment variables:"
          env | grep -E "(NODE|VITE|CI|GITHUB)" || true
          echo "Listing client directory:"
          ls -la "${{ github.workspace }}/client/"
          echo "Checking if node_modules exists in client:"
          ls -la "${{ github.workspace }}/client/node_modules" 2>/dev/null || echo "node_modules not found in client"
          echo "Attempting build with increased memory and verbose output..."
          cd "${{ github.workspace }}/client" && NODE_OPTIONS="--max-old-space-size=4096" npm run build --verbose 2>&1
          echo "=== Client build completed ==="

      - name: Prepare server public
        run: |
          rm -rf "${{ github.workspace }}/server/public"
          cp -R "${{ github.workspace }}/client/dist" "${{ github.workspace }}/server/public"

      - name: Package FPK (ARM64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ROOT_DIR="${{ github.workspace }}"
          PKG_NAME="fngram-${{ github.ref_name }}-arm64"
          RELEASE_DIR="${ROOT_DIR}/release"
          WORK_DIR="${RELEASE_DIR}/${PKG_NAME}"
          PACKAGE_SRC="${ROOT_DIR}/fnos-native-package"

          rm -rf "${WORK_DIR}" "${RELEASE_DIR}/${PKG_NAME}.fpk"
          mkdir -p "${WORK_DIR}"
          cp -R "${PACKAGE_SRC}/." "${WORK_DIR}/"
          rm -rf "${WORK_DIR}/app/server"
          mkdir -p "${WORK_DIR}/app/server"

          cp "${ROOT_DIR}/server/package.json" "${WORK_DIR}/app/server/"
          cp -R "${ROOT_DIR}/server/src" "${ROOT_DIR}/server/public" "${WORK_DIR}/app/server/"
          cp -R "${ROOT_DIR}/server/node_modules" "${WORK_DIR}/app/server/"
          rm -rf "${WORK_DIR}/app/server/src/downloader"

          find "${WORK_DIR}" -name ".DS_Store" -delete
          find "${WORK_DIR}/cmd" -type f -exec chmod +x {} \;
          rm -f "${WORK_DIR}/app/bin/fngram-downloader"
          chmod +x "${WORK_DIR}/app/ui/proxy.cgi" "${WORK_DIR}/app/bin/node"

          (
            cd "${WORK_DIR}"
            mkdir -p app_payload
            cp -R app/server app_payload/server
            cp -R app/bin app_payload/bin
            cp -R app/ui app_payload/ui
            cp -R config app_payload/config
            tar -czf app.tgz -C app_payload server bin ui config
            rm -rf app app_payload
            tar -czf "${RELEASE_DIR}/${PKG_NAME}.fpk" *
          )

          ls -lh "${RELEASE_DIR}/${PKG_NAME}.fpk"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fngram-fpk-arm64
          path: release/*.fpk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fngram ${{ github.ref_name }}
          body: |
            ## Fngram ${{ github.ref_name }}

            ARM64 FPK 安装包，适用于飞牛 OS / fnOS ARM 设备。

            ### 安装方式
            1. 下载下方 .fpk 文件
            2. 在 fnOS 应用中心上传安装
            3. 或在 Fngram 管理后台「运行诊断」中一键下载更新
          files: release/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}