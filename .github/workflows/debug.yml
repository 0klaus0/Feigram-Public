name: Debug npm ci

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Debug server dir
        run: |
          echo "=== Current directory: $(pwd) ==="
          echo "=== Node version: $(node --version) ==="
          echo "=== NPM version: $(npm --version) ==="
          echo "=== server directory contents: ==="
          ls -la server/
          echo "=== server/package.json: ==="
          cat server/package.json
          echo "=== server/package-lock.json (first 50 lines): ==="
          head -50 server/package-lock.json
          echo "=== Running npm ls in server: ==="
          cd server && npm ls 2>&1 | head -30
          
      - name: Try npm install in server
        run: |
          echo "=== Trying npm install in server ==="
          cd server && npm install --verbose 2>&1 | tail -50